apiVersion: v1
kind: PersistentVolume
metadata:
  name: dev-containers-code-pv
  labels:
    app.kubernetes.io/name: dev-containers
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dev-containers-local
  hostPath:
    path: /opt/dev_containers/code
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-containers-code
  labels:
    app.kubernetes.io/name: dev-containers
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: dev-containers-local
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-containers
  labels:
    app.kubernetes.io/name: dev-containers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-containers
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-containers
    spec:
      containers:
        - name: dev-containers
          image: ghcr.io/smagicalk/dev_containers:latest
          imagePullPolicy: Always
          env:
            - name: SSH_PASSWORD
              value: "dev_containers"
          ports:
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /workspace
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: code
          persistentVolumeClaim:
            claimName: dev-containers-code
---
apiVersion: v1
kind: Service
metadata:
  name: dev-containers
  labels:
    app.kubernetes.io/name: dev-containers
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: dev-containers
  ports:
    - name: ssh
      port: 50022
      targetPort: ssh
      protocol: TCP
