apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-containers
  labels:
    app.kubernetes.io/name: dev-containers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-containers
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-containers
    spec:
      containers:
        - name: dev-containers
          image: ghcr.io/smagicalk/dev_containers:latest
          imagePullPolicy: Always
          env:
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-containers-ssh
                  key: password
          ports:
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /workspace
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: code
          hostPath:
            path: /opt/dev_containers/code
            type: DirectoryOrCreate
